       Firebase-Web-Config hier einfügen (Firebase Console → Projekteinstellungen → "Meine Apps" → Web-App).
       Solange hier null steht, läuft die Liste nur lokal auf dem jeweiligen Gerät. */

      storageBucket: "essensliste-wa2a.firebasestorage.app",
      messagingSenderId: "335733558574",
      appId: "1:335733558574:web:23cfad3b7bbc8609d03ebf"
    };
    /* Beispiel:
    window.ESSEN_FIREBASE_CONFIG = {
      apiKey: "AIza...",

      storageBucket: "essensliste-wa2a.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123"
    };
    */
    window.ESSEN_START = "06:20";                    // Beginn des Eintragens (Papierliste ab 06:20)
    window.ESSEN_LEBENSDAUER_STUNDEN = 26;          // Liste wird 26 h nach Beginn (06:20) gelöscht → am Folgetag 08:20
    window.ESSEN_DOKUMENT = "essensliste/wa2a";      // Speicherort in Firestore
    window.ESSEN_HAUSL_PIN = "0112";                 // PIN für Hausl-Dashboard und "Hausl AN"

  <script>
/* ==== Gemeinsamer Speicher für die Brotzeit Liste ====
   - Mit Firebase-Config: alle Geräte teilen dieselbe Liste (Echtzeit).
   - Ohne Config: nur lokal auf diesem Gerät (localStorage).
   - Jede Liste lebt max. LEBENSDAUER_STUNDEN ab der ersten Eintragung, danach wird sie gelöscht. */
(function () {
  var CFG = window.ESSEN_FIREBASE_CONFIG;
  var TTL = (window.ESSEN_LEBENSDAUER_STUNDEN || 26) * 3600 * 1000;
  var LS_KEY = "essensliste-wa2a-v1";
  var OBJ_KEYS = { orders: 1, anwesend: 1 }; // pro Name einzeln speichern -> keine gegenseitigen Überschreibungen

  var state = {}, defaults = {}, subs = {}, createdAt = null, lastData = null;
  var fb = null, ref = null, ready = false, queue = [];

  function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function emit(k) { (subs[k] || []).slice().forEach(function (f) { f(state[k]); }); }
  // Beginn der Liste = ESSEN_START (06:20) am Tag des ersten Eintrags
  function startAnchor() {
    var hm = String(window.ESSEN_START || "06:20").split(":");
    var d = new Date(); d.setHours(+hm[0] || 0, +hm[1] || 0, 0, 0);
    return d.getTime();
  }
  function expired(ts) { return ts != null && Date.now() - ts > TTL; }

  function resetAll() {
    createdAt = null; lastData = null;
    Object.keys(defaults).forEach(function (k) { state[k] = clone(defaults[k]); emit(k); });
  }
  function pick(k, data) {
    if (!data || !Object.prototype.hasOwnProperty.call(data, k)) return clone(defaults[k]);
    if (OBJ_KEYS[k] && data[k]) return Object.assign(clone(defaults[k]), data[k]);
    return data[k];
  }
  function applyRemote(data) {
    lastData = data;
    Object.keys(defaults).forEach(function (k) {
      var v = pick(k, data);
      if (!same(v, state[k])) { state[k] = v; emit(k); }
    });
  }

  /* ---------- Banner (nur bei lokalem Modus / Fehler) ---------- */
  function banner(text, color) {
    var el = document.getElementById("es-banner");
    if (!text) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement("div"); el.id = "es-banner"; el.style.cursor = "pointer";
      el.style.cssText = "position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);z-index:9999;font:600 11px Inter,system-ui;padding:6px 12px;border-radius:999px;color:#fff;max-width:92vw;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4)";
      (document.body || document.documentElement).appendChild(el);
    }
    el.style.background = color; el.textContent = text + "  ✕";
    el.onclick = function () { el.remove(); };
  }

  /* ---------- Lokaler Modus ---------- */
  function lsLoad() {
    try {
      var raw = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (!raw || expired(raw.createdAt)) { localStorage.removeItem(LS_KEY); return; }
      createdAt = raw.createdAt; applyRemote(raw.data);
    } catch (e) {}
  }
  function lsSave() {
    if (createdAt == null || expired(createdAt)) createdAt = startAnchor();
    var data = {}; Object.keys(defaults).forEach(function (k) { data[k] = state[k]; });
    try { localStorage.setItem(LS_KEY, JSON.stringify({ createdAt: createdAt, data: data })); } catch (e) {}
  }

  /* ---------- Firebase ---------- */
  var V = "10.12.2", BASE = "https://www.gstatic.com/firebasejs/" + V + "/";
  function connect() {
    Promise.all([import(BASE + "firebase-app.js"), import(BASE + "firebase-firestore.js")]).then(function (m) {
      var app = m[0].initializeApp(CFG); fb = m[1];
      var db = fb.getFirestore(app);
      ref = fb.doc(db, window.ESSEN_DOKUMENT || "essensliste/wa2a");
      fb.onSnapshot(ref, function (snap) {
        var d = snap.exists() ? snap.data() : null;
        if (!d || expired(d.createdAt)) {
          if (d) fb.deleteDoc(ref).catch(function () {});
          resetAll();
        } else { createdAt = d.createdAt; applyRemote(d); }
        if (!ready) { ready = true; banner(null); var q = queue; queue = []; q.forEach(function (f) { f(); }); }
      }, function (err) { banner("⚠ Keine Verbindung zur gemeinsamen Liste: " + (err.code || err.message), "#b45309"); });
    }).catch(function (e) { banner("⚠ Firebase konnte nicht geladen werden – nur lokal", "#b45309"); CFG = null; lsLoad(); });
  }

  function remoteWrite(key, prev, next) {
    if (!ready) { queue.push(function () { remoteWrite(key, prev, next); }); return; }
    var fresh = createdAt == null || expired(createdAt);
    if (fresh) {
      // neue Liste anlegen (überschreibt alte/abgelaufene komplett)
      createdAt = startAnchor();
      var data = { createdAt: createdAt, expireAt: fb.Timestamp.fromMillis(createdAt + TTL) };
      Object.keys(defaults).forEach(function (k) { data[k] = state[k]; });
      fb.setDoc(ref, data).catch(onErr);
      return;
    }
    var args = [];
    if (OBJ_KEYS[key] && prev && next && typeof next === "object") {
      var names = {}; Object.keys(prev).concat(Object.keys(next)).forEach(function (n) { names[n] = 1; });
      Object.keys(names).forEach(function (n) {
        if (!same(prev[n], next[n])) args.push(new fb.FieldPath(key, n), next[n] === undefined ? fb.deleteField() : next[n]);
      });
    } else args.push(key, next === undefined ? null : next);
    if (!args.length) return;
    fb.updateDoc.apply(null, [ref].concat(args)).catch(onErr);
  }
  function onErr(e) { banner("⚠ Speichern fehlgeschlagen: " + (e.code || e.message), "#b91c1c"); }

  /* ---------- Hausl-PIN ---------- */
  window.ESPin = function () {
    var pin = String(window.ESSEN_HAUSL_PIN || "");
    if (!pin) return true;
    try { if (sessionStorage.getItem("es-hausl-pin") === pin) return true; } catch (e) {}
    var eingabe = window.prompt("Hausl-PIN eingeben:");
    if (eingabe === null) return false;
    if (eingabe.trim() === pin) {
      try { sessionStorage.setItem("es-hausl-pin", pin); } catch (e) {}
      return true;
    }
    window.alert("Falscher PIN");
    return false;
  };

  /* ---------- API für die App ---------- */
  window.ESStore = {
    register: function (key, init) {
      if (!Object.prototype.hasOwnProperty.call(defaults, key)) {
        defaults[key] = clone(typeof init === "function" ? init() : init);
        state[key] = pick(key, lastData);
      }
      return state[key];
    },
    get: function (key) { return state[key]; },
    sub: function (key, fn) {
      (subs[key] = subs[key] || []).push(fn);
      return function () { subs[key] = subs[key].filter(function (f) { return f !== fn; }); };
    },
    set: function (key, upd) {
      var prev = state[key];
      var next = typeof upd === "function" ? upd(prev) : upd;
      if (same(prev, next)) return;
      state[key] = next; emit(key);
      if (CFG) remoteWrite(key, prev, next); else lsSave();
    }
  };

  // Ablauf auch bei offener App prüfen
  setInterval(function () {
    if (createdAt != null && expired(createdAt)) {
      if (CFG && ref) fb.deleteDoc(ref).catch(function () {}); else localStorage.removeItem(LS_KEY);
      resetAll();
    }
  }, 60000);

  if (CFG && CFG.projectId) connect();
  else {
    CFG = null;
    lsLoad();
    document.addEventListener("DOMContentLoaded", function () {
      banner("Lokaler Modus – Firebase noch nicht eingerichtet, Liste nur auf diesem Gerät", "#3f3f46");
    });
  }
})();
